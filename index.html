<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141d">
    <title>IMDb Ratings Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10141d;
        color: #f3f5f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 24px;
        background:
          radial-gradient(ellipse at 12% 0%, rgb(44 69 105 / 25%), transparent 42%),
          #10141d;
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #9aa8bc;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 10px 0 30px;
        color: #aab4c3;
        line-height: 1.6;
      }

      .card {
        overflow: hidden;
        border: 1px solid #293241;
        border-radius: 18px;
        background: #181e29;
        box-shadow: 0 24px 70px rgb(0 0 0 / 20%);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 28px 12px;
      }

      h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 650;
      }

      .badge {
        padding: 6px 10px;
        border: 1px solid #354154;
        border-radius: 999px;
        color: #aeb9ca;
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .chart {
        padding: 8px 18px 0 8px;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .grid-line {
        stroke: #303949;
        stroke-width: 1;
      }

      .axis-label {
        fill: #9aa8bc;
        font-size: 13px;
      }

      .curve {
        fill: none;
        stroke: #f5c518;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .chart-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 28px 22px;
        border-top: 1px solid #293241;
        color: #9aa8bc;
        font-size: 0.83rem;
      }

      .legend {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #d7dce4;
      }

      .legend-mark {
        width: 20px;
        height: 3px;
        border-radius: 4px;
        background: #f5c518;
      }

      @media (max-width: 600px) {
        body {
          padding: 32px 16px;
        }

        .card-header {
          align-items: flex-start;
          flex-direction: column;
          padding: 20px 20px 8px;
        }

        .chart {
          padding: 8px 10px 0 0;
        }

        .chart-footer {
          padding: 15px 20px 18px;
        }

        .axis-label {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Ratings overview</p>
      <h1>IMDb ratings</h1>
      <p class="intro">A clear view of the rating trend across release years.</p>

      <section class="card" aria-labelledby="chart-title">
        <div class="card-header">
          <h2 id="chart-title">Average rating by release year</h2>
          <span class="badge">Illustrative data</span>
        </div>
        <div class="chart">
          <svg viewBox="0 0 900 430" role="img" aria-labelledby="svg-title svg-description">
            <title id="svg-title">Illustrative IMDb ratings by release year</title>
            <desc id="svg-description">One line shows an example average rating trend from 2010 to 2025 on a scale from 0 to 10. These values are placeholders, not actual IMDb data.</desc>
            <g aria-hidden="true">
              <line class="grid-line" x1="72" y1="30" x2="870" y2="30"></line>
              <line class="grid-line" x1="72" y1="96" x2="870" y2="96"></line>
              <line class="grid-line" x1="72" y1="162" x2="870" y2="162"></line>
              <line class="grid-line" x1="72" y1="228" x2="870" y2="228"></line>
              <line class="grid-line" x1="72" y1="294" x2="870" y2="294"></line>
              <line class="grid-line" x1="72" y1="360" x2="870" y2="360"></line>

              <text class="axis-label" x="54" y="365" text-anchor="end">0</text>
              <text class="axis-label" x="54" y="299" text-anchor="end">2</text>
              <text class="axis-label" x="54" y="233" text-anchor="end">4</text>
              <text class="axis-label" x="54" y="167" text-anchor="end">6</text>
              <text class="axis-label" x="54" y="101" text-anchor="end">8</text>
              <text class="axis-label" x="54" y="35" text-anchor="end">10</text>

              <text class="axis-label" x="72" y="390" text-anchor="middle">2010</text>
              <text class="axis-label" x="338" y="390" text-anchor="middle">2015</text>
              <text class="axis-label" x="604" y="390" text-anchor="middle">2020</text>
              <text class="axis-label" x="870" y="390" text-anchor="middle">2025</text>
              <text class="axis-label" x="471" y="420" text-anchor="middle">Release year</text>
              <text class="axis-label" transform="translate(17 195) rotate(-90)" text-anchor="middle">IMDb rating</text>

              <path class="curve" d="M72 126 C118 118 132 108 178 112 S247 131 285 119 S355 91 391 103 S460 117 498 96 S566 81 604 91 S674 108 710 79 S780 64 817 76 S850 65 870 57"></path>
            </g>
          </svg>
        </div>
        <div class="chart-footer">
          <span class="legend"><span class="legend-mark" aria-hidden="true"></span>Average IMDb rating</span>
          <span>Placeholder values · 2010–2025</span>
        </div>
      </section>
    </main>
  </body>
</html>
